# Supply these variables in IntelliJ or your terminal; do not commit passwords.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shortlink_db?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Flyway creates the table; Hibernate checks that it matches the entity.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
